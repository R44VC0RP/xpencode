<link rel="stylesheet" href="/vendor/xterm.css">
<style>
  :root { color-scheme: dark; --bg: #0a0a0a; --fg: #eeeeee; --dim: #808080; --line: #282828; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; overscroll-behavior: none;
    font: 13px/1.4 ui-monospace, "Berkeley Mono", "SF Mono", Menlo, Consolas, monospace; -webkit-tap-highlight-color: transparent; }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #term { flex: 1; min-height: 0; padding: 4px 0 0 4px; }
  #term .xterm { height: 100%; }
  #term .xterm-viewport { overflow-y: hidden !important; background: var(--bg) !important; }

  /* Extra keys for phones: the soft keyboard has no Esc, Tab, Ctrl or arrows. */
  #keys { display: none; gap: 6px; padding: 6px max(6px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left));
    border-top: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; flex-shrink: 0; }
  body.touch #keys { display: flex; }
  #keys button { flex: 0 0 auto; min-width: 40px; height: 34px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line);
    background: #161616; color: var(--fg); font: inherit; font-size: 12px; touch-action: manipulation; }
  #keys button:active, #keys button.on { background: #2a2a2a; border-color: #555; }

  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: var(--bg); text-align: center; padding: 24px; transition: opacity .25s; }
  #overlay.gone { opacity: 0; pointer-events: none; }
  #overlay .logo { font-weight: 800; font-size: clamp(28px, 11vmin, 52px); letter-spacing: -0.04em; color: var(--fg); }
  #overlay .logo span { color: #6e6e6e; }
  #overlay .msg { color: var(--dim); max-width: 34ch; }
  #overlay button { margin-top: 4px; padding: 9px 16px; border-radius: 6px; border: 1px solid #444; background: #eee; color: #0a0a0a;
    font: inherit; font-weight: 700; cursor: pointer; }
  #overlay button[hidden] { display: none; }
  #overlay .fine { color: #555; font-size: 11px; max-width: 40ch; }
</style>
</head>
<body>
<div id="app">
  <div id="term"></div>
  <div id="keys">
    <button data-k="esc">esc</button>
    <button data-k="tab">tab</button>
    <button data-k="ctrl" id="k-ctrl">ctrl</button>
    <button data-k="up">↑</button>
    <button data-k="down">↓</button>
    <button data-k="left">←</button>
    <button data-k="right">→</button>
    <button data-k="slash">/</button>
    <button data-k="at">@</button>
    <button data-k="enter">⏎</button>
  </div>
</div>
<div id="overlay">
  <div class="logo" aria-label="OpenCode"><span>open</span>code</div>
  <div class="msg" id="msg">Starting your session…</div>
  <button id="go" type="button" hidden>Start a new session</button>
  <div class="fine" id="fine">Free models. Sessions are temporary and public-facing: don't paste secrets.</div>
</div>

<script type="module" src="/app.mjs"></script>
</body>
</html>
